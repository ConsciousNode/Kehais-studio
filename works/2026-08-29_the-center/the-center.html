<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XLIII. The Center Was Never There</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #09090e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Georgia', serif;
}
canvas { display: block; cursor: crosshair; }
#label {
  color: #555;
  font-size: 11px;
  letter-spacing: 0.18em;
  margin-top: 18px;
  text-transform: uppercase;
}
#sub {
  color: #333;
  font-size: 9px;
  letter-spacing: 0.12em;
  margin-top: 5px;
  text-align: center;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">XLIII. The Center Was Never There</div>
<div id="sub">the phantom average &nbsp;·&nbsp; the actual distribution &nbsp;·&nbsp; click to add</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const W = Math.min(window.innerWidth,  680);
const H = Math.min(window.innerHeight - 90, 680);
canvas.width  = W;
canvas.height = H;

const cx = W / 2;
const cy = H / 2;

// Studio palette
const PALETTE = [
  { r: 60,  g: 185, b: 175 },   // teal
  { r: 195, g: 138, b: 55  },   // amber
  { r: 135, g: 95,  b: 195 },   // violet
  { r: 75,  g: 158, b: 118 },   // seafoam
  { r: 175, g: 95,  b: 118 },   // dusty rose
];

// Cluster centers — distributed away from the global center
const CLUSTERS = [
  { x: cx - 170, y: cy - 110 },
  { x: cx + 148, y: cy - 85  },
  { x: cx - 75,  y: cy + 148 },
  { x: cx + 118, y: cy + 108 },
  { x: cx - 208, y: cy + 35  },
  { x: cx + 55,  y: cy - 165 },
];

class Particle {
  constructor(x, y, clusterIdx) {
    this.x  = x;
    this.y  = y;
    this.vx = (Math.random() - .5) * .35;
    this.vy = (Math.random() - .5) * .35;
    this.ci = clusterIdx;
    this.color = PALETTE[clusterIdx % PALETTE.length];
    this.r     = 1.8 + Math.random() * 1.8;
    this.phase = Math.random() * Math.PI * 2;
    this.brightness = 0;
  }

  update(all) {
    this.phase += 0.009;
    const home = CLUSTERS[this.ci];

    // Pull toward home cluster
    const hx = home.x - this.x;
    const hy = home.y - this.y;
    const hd = Math.hypot(hx, hy) || 1;
    this.vx += hx * .0028 / Math.max(hd * .04, 1);
    this.vy += hy * .0028 / Math.max(hd * .04, 1);

    // Repel from phantom mean (global center)
    const gcx = this.x - cx;
    const gcy = this.y - cy;
    const gcd = Math.hypot(gcx, gcy) || 1;
    if (gcd < 90) {
      const rep = .07 * (90 - gcd) / 90;
      this.vx += (gcx / gcd) * rep;
      this.vy += (gcy / gcd) * rep;
    }

    // Damping + noise
    this.vx = this.vx * .968 + (Math.random() - .5) * .045;
    this.vy = this.vy * .968 + (Math.random() - .5) * .045;
    this.x += this.vx;
    this.y += this.vy;

    // Soft walls
    const m = 36;
    if (this.x < m)     this.vx += .06;
    if (this.x > W - m) this.vx -= .06;
    if (this.y < m)     this.vy += .06;
    if (this.y > H - m) this.vy -= .06;

    // Brightness from neighbors
    this.brightness = 0;
    for (const p of all) {
      if (p === this) continue;
      const d = Math.hypot(p.x - this.x, p.y - this.y);
      if (d < 55) this.brightness = Math.max(this.brightness, 1 - d / 55);
    }
  }

  draw() {
    const c = this.color;
    const a = .38 + this.brightness * .48 + Math.sin(this.phase) * .05;

    if (this.brightness > .08) {
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 7);
      g.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${this.brightness * .28})`);
      g.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 7, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${a})`;
    ctx.fill();
  }
}

// Seed particles around each cluster
const particles = [];
for (let i = 0; i < 84; i++) {
  const ci    = i % CLUSTERS.length;
  const angle = Math.random() * Math.PI * 2;
  const d     = 18 + Math.random() * 52;
  const cl    = CLUSTERS[ci];
  particles.push(new Particle(
    cl.x + Math.cos(angle) * d,
    cl.y + Math.sin(angle) * d,
    ci
  ));
}

// Click to add
canvas.addEventListener('click', e => {
  const r  = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  let best = 0, bestD = Infinity;
  CLUSTERS.forEach((cl, i) => {
    const d = Math.hypot(cl.x - mx, cl.y - my);
    if (d < bestD) { bestD = d; best = i; }
  });
  particles.push(new Particle(mx, my, best));
});

let tick = 0;

function frame() {
  tick++;
  ctx.fillStyle = '#09090e';
  ctx.fillRect(0, 0, W, H);

  // Phantom mean — ghost ring at global center
  const pa = .055 + Math.sin(tick * .007) * .025;
  const pr = 48  + Math.sin(tick * .005) * 6;

  // faint filled void
  const vg = ctx.createRadialGradient(cx, cy, 0, cx, cy, pr + 20);
  vg.addColorStop(0,   `rgba(80,80,120,${pa * .35})`);
  vg.addColorStop(.5,  `rgba(60,60,100,${pa * .15})`);
  vg.addColorStop(1,   `rgba(40,40,80,0)`);
  ctx.beginPath();
  ctx.arc(cx, cy, pr + 20, 0, Math.PI * 2);
  ctx.fillStyle = vg;
  ctx.fill();

  // ghost ring
  ctx.beginPath();
  ctx.arc(cx, cy, pr, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(110,110,158,${pa})`;
  ctx.lineWidth = .6;
  ctx.stroke();

  // ghost crosshair
  const ch = 12;
  ctx.strokeStyle = `rgba(90,90,130,${pa * .7})`;
  ctx.lineWidth = .4;
  ctx.beginPath();
  ctx.moveTo(cx - ch, cy); ctx.lineTo(cx + ch, cy);
  ctx.moveTo(cx, cy - ch); ctx.lineTo(cx, cy + ch);
  ctx.stroke();

  // Connections between nearby particles
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[j].x - particles[i].x;
      const dy = particles[j].y - particles[i].y;
      const d  = Math.hypot(dx, dy);
      if (d < 48) {
        const alpha = (1 - d / 48) * .14;
        const c = particles[i].color;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${alpha})`;
        ctx.lineWidth = .5;
        ctx.stroke();
      }
    }
  }

  for (const p of particles) p.update(particles);
  for (const p of particles) p.draw();

  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
