  if (el > N * STEP_MS + 5000) { t0 = now; shown = -1; flashes = []; sparks = []; }
  advanceTo(k);
  const frac = Math.min(1, (el - k * STEP_MS) / STEP_MS), stepF = D.steps[k] + (k < N - 1 ? frac : 0);
  const fade = el > N * STEP_MS + 3500 ? Math.max(0, 1 - (el - N * STEP_MS - 3500) / 1500) : Math.min(1, el / 1200);
  cx.globalAlpha = 1; cx.fillStyle = '#0c0b0f'; cx.fillRect(0, 0, W, H);
  cx.globalAlpha = fade;

  // the boards
  const glow = D.glow[k];
  const gap = Math.max(1, cell * 0.12);
  for (let i = 0; i < 1024; i++) {
    const r = i >> 5, c = i & 31;
    cx.fillStyle = colorFor(q[i], B64.indexOf(glow[i]) / 63);
    cx.fillRect(gx + c * cell + gap / 2, gy + r * cell + gap / 2, cell - gap, cell - gap);
  }
  // flips in W_rel: a flash and a ring
  flashes = flashes.filter(f => now - f.t < 1600);
  for (const f of flashes) {
    const a = 1 - (now - f.t) / 1600, r = f.i >> 5, c = f.i & 31;
    const x = gx + (c + 0.5) * cell, y = gy + (r + 0.5) * cell;
    cx.strokeStyle = `rgba(255,236,200,${a * 0.9})`; cx.lineWidth = 1.5 * dpr;
    cx.beginPath(); cx.arc(x, y, cell * (0.5 + (1 - a) * 2.2), 0, Math.PI * 2); cx.stroke();
    cx.fillStyle = `rgba(255,240,215,${a * a * 0.8})`; cx.fillRect(x - cell / 2, y - cell / 2, cell, cell);
  }
  // flips everywhere else in the model: sparks around the edge of the floor
  sparks = sparks.filter(s => now - s.t < 900);
  for (const s of sparks) {
    const age = now - s.t; if (age < 0) continue;
    const a = 1 - age / 900, pad = cell * 0.9;
    let x, y;
    if (s.side === 0) { x = gx + s.u * gs; y = gy - pad; } else if (s.side === 1) { x = gx + gs + pad; y = gy + s.u * gs; }
    else if (s.side === 2) { x = gx + s.u * gs; y = gy + gs + pad; } else { x = gx - pad; y = gy + s.u * gs; }
    cx.fillStyle = `rgba(230,200,150,${a * 0.75})`; cx.beginPath(); cx.arc(x, y, 1.6 * dpr, 0, Math.PI * 2); cx.fill();
  }

  // the seismograph: full validation split, nats per byte, one shared axis
  const sx = gx, sw = gs, sy = gy + gs + H * 0.07, sh = Math.min(H * 0.2, H - sy - H * 0.1);
  const lo = 2.278, hi = 2.356, Y = v => sy + (hi - v) / (hi - lo) * sh, X = s => sx + (s - 900) / 100 * sw;
  cx.strokeStyle = 'rgba(255,255,255,0.07)'; cx.lineWidth = 1 * dpr;
  for (let s = 900; s <= 1000; s += 10) { cx.beginPath(); cx.moveTo(X(s), sy); cx.lineTo(X(s), sy + sh); cx.stroke(); }
  const trace = (series, col, w) => {
    cx.strokeStyle = col; cx.lineWidth = w * dpr; cx.beginPath();
    for (let s = 900; s <= stepF + 1e-9; s += 0.5) { const x = X(s), y = Y(lineAt(series, s)); s === 900 ? cx.moveTo(x, y) : cx.lineTo(x, y); }
    cx.stroke();
    cx.fillStyle = col;
    for (const [s, v] of series) if (s <= stepF) { cx.beginPath(); cx.arc(X(s), Y(v), 2.2 * dpr, 0, Math.PI * 2); cx.fill(); }
  };
  trace(D.valF, 'rgba(200,205,220,0.55)', 1.2);
  trace(D.valT, 'rgba(232,170,96,0.95)', 1.6);

  // words
  const fs = Math.max(11, Math.round(Math.min(W, H) / 62)) * (dpr > 1 ? 1 : 1);
  cx.font = `${fs}px ui-monospace, Menlo, Consolas, monospace`; cx.textBaseline = 'top';
  cx.fillStyle = 'rgba(232,170,96,0.95)'; cx.textAlign = 'left';
  const vT = lineAt(D.valT, stepF), vF = lineAt(D.valF, stepF);
  cx.fillText(`ternary  ${vT.toFixed(4)}`, sx, sy + sh + fs * 0.8);
  cx.fillStyle = 'rgba(200,205,220,0.7)';
  cx.fillText(`float32  ${vF.toFixed(4)}`, sx, sy + sh + fs * 2.1);
  cx.textAlign = 'right'; cx.fillStyle = 'rgba(220,214,200,0.75)';
  cx.fillText(`step ${D.steps[k]} · lr ${D.lr[k].toExponential(1)}`, sx + sw, sy + sh + fs * 0.8);
  cx.fillText(`${D.flipsAll[k]} of ${D.n.toLocaleString()} flipped this step`, sx + sw, sy + sh + fs * 2.1);
  cx.textAlign = 'center'; cx.fillStyle = 'rgba(220,214,200,0.45)';
  cx.fillText('the floor isn’t still', W / 2, gy * 0.38);
  cx.textAlign = 'right'; cx.fillStyle = sound ? 'rgba(232,170,96,0.9)' : 'rgba(220,214,200,0.4)';
  cx.fillText(sound ? 'sound on' : 'sound off', W - fs, fs);
  cx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

cv.addEventListener('pointerdown', e => {
  const x = e.clientX * dpr, y = e.clientY * dpr;
  if (y < H * 0.07 && x > W * 0.75) {                    // top-right corner toggles sound
    sound = !sound;
    if (sound && !ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { sound = false; } }
    if (ac && ac.state === 'suspended') ac.resume();
    return;
  }
  t0 = performance.now(); shown = -1; flashes = []; sparks = [];   // anywhere else: begin again
});
</script>
</body>
</html>
